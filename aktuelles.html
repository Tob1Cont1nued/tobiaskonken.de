    var l = null;
    try { l = localStorage.getItem("lang"); } catch (e) {}
    if (l !== "de" && l !== "en") l = (navigator.language || "de").toLowerCase().indexOf("de") === 0 ? "de" : "en";
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l;
  })();
</script>
