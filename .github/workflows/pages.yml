# Bei jedem Push: Playwright-Tests zweimal ausführen und die Seite samt beider Reports veröffentlichen.
#   1. alle Tests      → müssen grün sein, sonst wird nichts veröffentlicht
#   2. Sprachtests     → Demo-Report ohne Bug
#   3. mit ?bug=lang   → mindestens ein Sprachtest MUSS rot werden, sonst taugen die Tests nichts
name: Tests und Veröffentlichung

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Alle Tests (Homepage und Sortierbot) müssen grün sein
        run: npx playwright test
        env:
          REPORT_DIR: report/all

      - name: Demo-Report ohne Bug (Sprachwechsel)
        run: npx playwright test tests/sprache.spec.ts
        env:
          REPORT_DIR: report/ok

      - name: Tests mit eingebautem Bug (müssen rot werden)
        run: |
          if BUG=1 REPORT_DIR=report/bug npx playwright test tests/sprache.spec.ts; then
            echo "::error::Der eingebaute Fehler wurde NICHT erkannt – die Tests sind zu schwach."
            exit 1
          fi
          echo "Fehler erkannt – genau so soll es sein."

      - name: Laufinfo für die Demo
        run: |
          printf '{"sha":"%s","run":"%s","url":"%s/%s/actions/runs/%s","time":"%s"}\n' \
            "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > report/run.json

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude node_modules --exclude test-results \
            --exclude package.json --exclude package-lock.json --exclude playwright.config.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
